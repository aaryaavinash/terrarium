<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc"><title id="title">Four scenes from Bell &amp; Moss</title><desc id="desc">Four illustrated chapter cards for the project's main themes.</desc><rect width="1200" height="380" fill="#efe9dd"/><path d="M40 40H1160M40 347H1160" stroke="#9eab89" stroke-opacity=".8"/><path d="M320 40V347" stroke="#9eab89" stroke-opacity=".55"/><text x="55" y="67" fill="#9eab89" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">CHAPTER 01</text><circle cx="180" cy="173" r="68" fill="none" stroke="#46602f" stroke-opacity=".7" stroke-width="2"/><circle cx="180" cy="173" r="46" fill="none" stroke="#9eab89" stroke-opacity=".65"/><path d="M180 106V240M113 173H247" stroke="#46602f" stroke-opacity=".55"/><!-- ORIGINAL (preserved, not deleted — disabled by comment): <circle cx="180" cy="173" r="17" fill="#46602f"/> --><text x="180" y="191" text-anchor="middle" fill="#46602f" font-family="Georgia,serif" font-size="54" font-style="italic">M</text><text x="55" y="281" fill="#22281f" font-family="Georgia,serif" font-style="italic" font-size="22">Moss Forest</text><text x="55" y="307" fill="#9eab89" font-family="Arial,sans-serif" font-size="11">A shaded world with its own</text><text x="55" y="325" fill="#9eab89" font-family="Arial,sans-serif" font-size="11">floor.</text><path d="M600 40V347" stroke="#9eab89" stroke-opacity=".55"/><text x="335" y="67" fill="#9eab89" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">CHAPTER 02</text><circle cx="460" cy="173" r="68" fill="none" stroke="#46602f" stroke-opacity=".7" stroke-width="2"/><circle cx="460" cy="173" r="46" fill="none" stroke="#9eab89" stroke-opacity=".65"/><path d="M460 106V240M393 173H527" stroke="#46602f" stroke-opacity=".55"/><!-- ORIGINAL (preserved, not deleted — disabled by comment): <circle cx="460" cy="173" r="17" fill="#46602f"/> --><text x="460" y="191" text-anchor="middle" fill="#46602f" font-family="Georgia,serif" font-size="54" font-style="italic">H</text><text x="335" y="281" fill="#22281f" font-family="Georgia,serif" font-style="italic" font-size="22">High Desert</text><text x="335" y="307" fill="#9eab89" font-family="Arial,sans-serif" font-size="11">A dry landscape under glass.</text><path d="M880 40V347" stroke="#9eab89" stroke-opacity=".55"/><text x="615" y="67" fill="#9eab89" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">CHAPTER 03</text><circle cx="740" cy="173" r="68" fill="none" stroke="#46602f" stroke-opacity=".7" stroke-width="2"/><circle cx="740" cy="173" r="46" fill="none" stroke="#9eab89" stroke-opacity=".65"/><path d="M740 106V240M673 173H807" stroke="#46602f" stroke-opacity=".55"/><!-- ORIGINAL (preserved, not deleted — disabled by comment): <circle cx="740" cy="173" r="17" fill="#46602f"/> --><text x="740" y="191" text-anchor="middle" fill="#46602f" font-family="Georgia,serif" font-size="54" font-style="italic">C</text><text x="615" y="281" fill="#22281f" font-family="Georgia,serif" font-style="italic" font-size="22">Cloud Tropic</text><text x="615" y="307" fill="#9eab89" font-family="Arial,sans-serif" font-size="11">Humidity gathers above the</text><text x="615" y="325" fill="#9eab89" font-family="Arial,sans-serif" font-size="11">canopy.</text><path d="M1160 40V347" stroke="#9eab89" stroke-opacity=".55"/><text x="895" y="67" fill="#9eab89" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">CHAPTER 04</text><circle cx="1020" cy="173" r="68" fill="none" stroke="#46602f" stroke-opacity=".7" stroke-width="2"/><circle cx="1020" cy="173" r="46" fill="none" stroke="#9eab89" stroke-opacity=".65"/><path d="M1020 106V240M953 173H1087" stroke="#46602f" stroke-opacity=".55"/><!-- ORIGINAL (preserved, not deleted — disabled by comment): <circle cx="1020" cy="173" r="17" fill="#46602f"/> --><text x="1020" y="191" text-anchor="middle" fill="#46602f" font-family="Georgia,serif" font-size="54" font-style="italic">W</text><text x="895" y="281" fill="#22281f" font-family="Georgia,serif" font-style="italic" font-size="22">The water cycle</text><text x="895" y="307" fill="#9eab89" font-family="Arial,sans-serif" font-size="11">A closed world tends itself.</text></svg>